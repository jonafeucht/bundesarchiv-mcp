name: Update LanceDB Index (Election Integrity)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch Election Integrity Index from Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mcp-server/lancedb_index_election_integrity
          
          echo "Searching for latest lancedb_index_election_integrity.tar.gz asset..."
          
          if gh release download --pattern "lancedb_index_election_integrity.tar.gz" --dir mcp-server/ 2>/dev/null; then
            echo "Found Election Integrity index in latest release."
          else
            echo "Election Integrity index not found in latest release. Searching previous releases..."
            
            FOUND=false
            for TAG in $(gh release list --limit 30 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'); do
              echo "Checking release: $TAG"
              if gh release download "$TAG" --pattern "lancedb_index_election_integrity.tar.gz" --dir mcp-server/ 2>/dev/null; then
                echo "Found Election Integrity index in release $TAG."
                FOUND=true
                break
              fi
            done
            
            if [ "$FOUND" = "false" ]; then
              echo "No existing Election Integrity index found. Starting with a fresh index."
            fi
          fi

          if [ -f mcp-server/lancedb_index_election_integrity.tar.gz ]; then
            tar -xzf mcp-server/lancedb_index_election_integrity.tar.gz -C mcp-server/
            rm mcp-server/lancedb_index_election_integrity.tar.gz
            echo "Extracted Election Integrity index."
          fi

      - name: Fetch Files from RustFS API
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          mkdir -p election_integrity_files
          pip install awscli
          aws --endpoint-url "$AWS_ENDPOINT_URL" s3 sync "s3://$BUCKET_NAME/election-integrity/" ./election_integrity_files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir lancedb==0.34.0 pandas sentence-transformers pymupdf numpy python-dotenv mcp starlette uvicorn

      - name: Generate/Update LanceDB Index
        env:
          PDF_DIR: ${{ github.workspace }}/election_integrity_files
          DB_URI: ${{ github.workspace }}/mcp-server/lancedb_index_election_integrity
        run: python3 ingest_election_integrity.py

      - name: Upload index to latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf lancedb_index_election_integrity.tar.gz -C mcp-server lancedb_index_election_integrity
          
          LATEST_TAG=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases | awk -F'\t' '{print $3}')
          
          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: No release found to upload index to." >&2
            exit 1
          fi
          
          CURRENT_DATE=$(date +'%Y-%m-%d')
          NEW_TITLE="LanceDB Index Update - Election Integrity ($CURRENT_DATE)"
          
          echo "Updating release title to: $NEW_TITLE"
          gh release edit "$LATEST_TAG" --title "$NEW_TITLE"
          
          echo "Uploading Election Integrity index to release: $LATEST_TAG"
          gh release upload "$LATEST_TAG" lancedb_index_election_integrity.tar.gz --clobber