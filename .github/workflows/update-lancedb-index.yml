name: Update LanceDB Index
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat-lancedb
    paths:
      - "mcp-data/**"
jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore LanceDB Cache
        id: db-cache
        uses: actions/cache@v4
        with:
          path: mcp-server/lancedb_index
          key: lancedb-index-${{ github.ref_name }}-${{ hashFiles('mcp-data/**') }}
          restore-keys: |
            lancedb-index-${{ github.ref_name }}-
            lancedb-index-

      - name: Fetch Index from Latest Release (Fallback)
        if: steps.db-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mcp-server/lancedb_index
          TAGS=$(gh release list --limit 5 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' 2>/dev/null || echo "")
          for TAG in $TAGS; do
            echo "Checking release $TAG for lancedb_index.tar.gz..."
            if gh release download "$TAG" --pattern "lancedb_index.tar.gz" --dir mcp-server/ 2>/dev/null; then
              echo "Found index in release $TAG. Extracting..."
              tar -xzf mcp-server/lancedb_index.tar.gz -C mcp-server/
              rm mcp-server/lancedb_index.tar.gz
              break
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "sentence-transformers[onnx]" optimum onnxruntime
          pip install lancedb==0.34.0 pandas sentence-transformers pymupdf numpy python-dotenv mcp starlette uvicorn pylance==8.0.0 peft==0.19.1 tqdm==4.68.4

      - name: Generate/Update LanceDB Index
        env:
          PDF_DIR: ${{ github.workspace }}/mcp-data
          DB_URI: ${{ github.workspace }}/mcp-server/lancedb_index
        run: python3 ingest.py
      - name: Upload index to latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf lancedb_index.tar.gz -C mcp-server lancedb_index

          LATEST_TAG=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases | awk -F'\t' '{print $3}')
          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: No release found to upload index to." >&2
            exit 1
          fi

          CURRENT_DATE=$(date +'%Y-%m-%d')
          NEW_TITLE="LanceDB Index Update ($CURRENT_DATE)"

          echo "Updating release title to: $NEW_TITLE"
          gh release edit "$LATEST_TAG" --title "$NEW_TITLE"

          echo "Uploading index to release: $LATEST_TAG"
          gh release upload "$LATEST_TAG" lancedb_index.tar.gz --clobber
